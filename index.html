    <script>
      // Prevent failed WebSocket connection attempts and suppress benign Vite HMR logs in preview sandbox
      (function() {
        // 1. Guard WebSocket constructor to prevent browser-level network connection errors
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isViteHmr = (Array.isArray(protocols) ? protocols.includes('vite-hmr') : protocols === 'vite-hmr') ||
                              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite')));
            if (isViteHmr) {
              const dummySocket = {
                readyState: 3, // CLOSED
                url: String(url),
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              return dummySocket;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING || 0;
          window.WebSocket.OPEN = OrigWebSocket.OPEN || 1;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING || 2;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED || 3;
        }

        // 2. Comprehensive log and error suppressor for any [vite] or HMR websocket messages
        function shouldSuppress(item) {
          if (!item) return false;
          try {
            const str = typeof item === 'string' ? item : (item.message || item.stack || String(item));
            return str.includes('[vite]') || str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://') || str.includes('failed to connect to websocket');
          } catch (_) {
            return false;
          }
        }

        function hasViteLog(args) {
          for (let i = 0; i < args.length; i++) {
            if (shouldSuppress(args[i])) return true;
          }
          return false;
        }

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          if (console[method]) {
            const orig = console[method];
            console[method] = function(...args) {
              if (hasViteLog(args)) return;
              orig.apply(console, args);
            };
          }
        });

        // 3. Prevent uncaught error events related to Vite client from bubbling to the test runner
        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.message) || shouldSuppress(event.error) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
